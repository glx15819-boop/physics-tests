<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Физика ОГЭ</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2937;background:#f3f6fa}*{box-sizing:border-box}main{max-width:840px;margin:30px auto;padding:0 18px}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 7px 30px #1d304312}h1{margin:0 0 8px}h2{white-space:pre-line;font-size:21px;line-height:1.4}p{line-height:1.65}.muted{color:#64748b}.pill{display:inline-block;background:#eaf2ff;color:#245f9a;border-radius:20px;padding:5px 12px;font-size:13px}.bar{height:8px;background:#e8eef6;border-radius:8px;overflow:hidden;margin:20px 0}.bar>div{height:100%;background:#2477c5;transition:width .2s}input{font:inherit;width:100%;padding:14px;border:1px solid #bac9d9;border-radius:12px;margin:10px 0}button{font:inherit;border:0;border-radius:11px;padding:11px 16px;background:#246fba;color:white;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:#e8eff8;color:#254765}button:disabled{opacity:.45;cursor:default}.feedback{min-height:25px;font-weight:600}.hint{background:#fff7df;border-left:4px solid #dda431;padding:10px 14px;border-radius:7px;margin:8px 0}.chart{width:100%;max-width:500px;height:auto}footer{margin-top:22px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}@media(max-width:550px){main{margin:10px auto}.card{padding:19px}}
</style></head><body><main><div class="card"><h1>Физика · подготовка к ОГЭ</h1><p class="muted">20 заданий. Ответ вводи самостоятельно, без выбора вариантов. Можно использовать подсказки. В конце скачай отчёт и отправь преподавателю.</p><div class="bar"><div id="bar"></div></div><div id="meta"></div><h2 id="stem"></h2><div id="figure" style="max-width:500px"></div><label for="answer">Твой ответ</label><input id="answer" autocomplete="off" placeholder="Число или последовательность цифр"><div id="feedback" class="feedback" aria-live="polite"></div><div id="hints"></div><button id="check">Проверить</button><button id="hint" class="secondary">Подсказка</button><footer><button id="prev" class="secondary">Назад</button><button id="next">Дальше</button></footer><div id="finish" hidden><h2>Работа завершена</h2><p id="summary"></p><button id="download">Скачать результаты (PNG)</button></div></div></main><script>
const Q=[{"n": 1, "topic": "Электричество", "stem": "Электрический прибор потребляет мощность 96 Вт при силе тока 4 А. Найдите напряжение (В).", "ans": "24", "hints": ["Вспомни связь мощности с током и напряжением.", "Вырази напряжение из формулы мощности."], "kind": "число", "diagram": "", "tol": 1e-06}, {"n": 2, "topic": "Механика", "stem": "Установите соответствие между величинами и единицами. А) импульс; Б) жёсткость пружины; В) мощность.\n1) Н/м; 2) Дж; 3) Вт; 4) кг·м/с.\nЗапишите цифры в порядке А, Б, В.", "ans": "413", "hints": ["Вспомни определения величин.", "Вырази единицы через массу, скорость, силу и расстояние."], "kind": "соответствие", "diagram": "", "tol": 1e-06}, {"n": 3, "topic": "Окружность", "stem": "Тело равномерно движется по окружности.\nВыберите два верных утверждения. Запишите их номера.\n1) Модуль скорости постоянен.\n2) Вектор скорости постоянен.\n3) Ускорение равно нулю.\n4) Вектор ускорения направлен к центру.\n5) Скорость направлена к центру.", "ans": "14", "hints": ["Раздели модуль и направление вектора.", "Нарисуй касательную и радиус в двух точках."], "kind": "утверждения", "diagram": "", "tol": 1e-06}, {"n": 4, "topic": "Механика", "stem": "На графике показан модуль скорости тела, движущегося прямолинейно.\nВыберите два верных утверждения. Запишите их номера.\n1) На участке 0–2 с ускорение по модулю равно 2 м/с².\n2) На участке 2–6 с тело покоится.\n3) Путь за первые 2 с равен 12 м.\n4) На участке 6–8 с кинетическая энергия возрастает.\n5) За время 2–6 с тело проходит 24 м.", "ans": "15", "hints": ["Ускорение связано с наклоном графика.", "Путь равен площади под графиком."], "kind": "утверждения", "diagram": "<svg viewBox=\"0 0 360 230\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"#bbb\" stroke-width=\"1\"><path d=\"M40 190H320\"/><path d=\"M40 170H320\"/><path d=\"M40 150H320\"/><path d=\"M40 130H320\"/><path d=\"M40 110H320\"/><path d=\"M40 90H320\"/><path d=\"M40 70H320\"/><path d=\"M40 50H320\"/><path d=\"M40 30H320\"/><path d=\"M40 30V190\"/><path d=\"M75 30V190\"/><path d=\"M110 30V190\"/><path d=\"M145 30V190\"/><path d=\"M180 30V190\"/><path d=\"M215 30V190\"/><path d=\"M250 30V190\"/><path d=\"M285 30V190\"/><path d=\"M320 30V190\"/></g><path d=\"M40 20V190H335\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><path d=\"M40 150L110 70L250 70L320 150\" stroke=\"#145da0\" stroke-width=\"3\" fill=\"none\"/><g font-size=\"12\" fill=\"#222\"><text x=\"5\" y=\"15\">v, м/с</text><text x=\"325\" y=\"215\">t, с</text><text x=\"35\" y=\"207\">0</text><text x=\"70\" y=\"207\">1</text><text x=\"105\" y=\"207\">2</text><text x=\"140\" y=\"207\">3</text><text x=\"175\" y=\"207\">4</text><text x=\"210\" y=\"207\">5</text><text x=\"245\" y=\"207\">6</text><text x=\"280\" y=\"207\">7</text><text x=\"315\" y=\"207\">8</text><text x=\"20\" y=\"194\">0</text><text x=\"20\" y=\"174\">1</text><text x=\"20\" y=\"154\">2</text><text x=\"20\" y=\"134\">3</text><text x=\"20\" y=\"114\">4</text><text x=\"20\" y=\"94\">5</text><text x=\"20\" y=\"74\">6</text><text x=\"20\" y=\"54\">7</text><text x=\"20\" y=\"34\">8</text></g></svg>", "tol": 1e-06}, {"n": 5, "topic": "Окружность", "stem": "Радиус окружности увеличили в 2 раза, угловую скорость уменьшили в 2 раза. Во сколько раз уменьшилось центростремительное ускорение?", "ans": "2", "hints": ["Вспомни формулу с угловой скоростью.", "Составь отношение нового ускорения к старому."], "kind": "число", "diagram": "", "tol": 1e-06}, {"n": 6, "topic": "Колебания и энергия", "stem": "Груз на горизонтальной пружине совершает свободные колебания без трения.\nВыберите два верных утверждения. Запишите их номера.\n1) В положении равновесия скорость равна нулю.\n2) В крайних положениях модуль ускорения максимален.\n3) Полная механическая энергия постоянна.\n4) В крайнем положении сила упругости равна нулю.\n5) При движении к равновесию потенциальная энергия увеличивается.", "ans": "23", "hints": ["Представь движение груза между двумя крайними точками.", "Сопоставь деформацию, силу и скорость."], "kind": "утверждения", "diagram": "", "tol": 1e-06}, {"n": 7, "topic": "Механика", "stem": "Пружина удлинилась на 3 см под действием силы 6 Н. Какова её жёсткость (Н/м)?", "ans": "200", "hints": ["Используй закон Гука.", "Переведи сантиметры в метры."], "kind": "число", "diagram": "", "tol": 1e-06}, {"n": 8, "topic": "Колебания и энергия", "stem": "Горизонтальный пружинный маятник колеблется без трения. А) положение равновесия; Б) крайнее положение; В) любое положение. Установите соответствие: 1) полная энергия равна начальной; 2) кинетическая энергия максимальна; 3) модуль силы упругости максимален. Для А и Б выберите характерные только для этих положений свойства, для В — свойство, выполняющееся всегда. Запишите цифры в порядке А, Б, В.", "ans": "231", "hints": ["Отличай положение равновесия от остановки.", "Вспомни, где пружина деформирована сильнее всего."], "kind": "соответствие", "diagram": "", "tol": 1e-06}, {"n": 9, "topic": "Колебания и энергия", "stem": "Камень бросили вертикально вверх. Сопротивлением воздуха пренебречь.\nВыберите два верных утверждения. Запишите их номера.\n1) При подъёме кинетическая энергия растёт.\n2) В верхней точке кинетическая энергия равна нулю.\n3) Полная механическая энергия уменьшается.\n4) Ускорение в верхней точке равно нулю.\n5) При подъёме потенциальная энергия увеличивается.", "ans": "25", "hints": ["Различай скорость и ускорение.", "Проследи изменение высоты и модуля скорости."], "kind": "утверждения", "diagram": "", "tol": 1e-06}, {"n": 10, "topic": "Колебания и энергия", "stem": "Период малых колебаний математического маятника равен 2 с. Длину нити увеличили в 9 раз. Найдите новый период (с).", "ans": "6", "hints": ["Вспомни зависимость периода от длины.", "Составь отношение периодов."], "kind": "число", "diagram": "", "tol": 1e-06}, {"n": 11, "topic": "Электричество", "stem": "Резисторы 3 Ом и 6 Ом соединены последовательно и подключены к источнику постоянного напряжения.\nВыберите два верных утверждения. Запишите их номера.\n1) Токи через резисторы одинаковы.\n2) Общее сопротивление равно 2 Ом.\n3) Напряжение на резисторе 3 Ом больше.\n4) Мощность на резисторе 6 Ом вдвое больше.\n5) За одинаковое время выделяется одинаковая теплота.", "ans": "14", "hints": ["Определи, какая величина одинакова при последовательном соединении.", "Сравни мощности при одинаковом токе."], "kind": "утверждения", "diagram": "", "tol": 1e-06}, {"n": 12, "topic": "Электричество", "stem": "На схеме два резистора подключены параллельно к идеальному источнику 12 В. Найдите показание идеального амперметра (А).", "ans": "6", "hints": ["Проследи, где разветвляется ток.", "Найди ток каждой ветви и сложи их."], "kind": "число", "diagram": "<svg viewBox=\"0 0 330 145\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"none\" stroke=\"#333\" stroke-width=\"2\"><path d=\"M20 70V20H90M150 20H245V120H145M120 120H20V70M90 20H150\"/><rect x=\"90\" y=\"10\" width=\"60\" height=\"20\" fill=\"white\"/><path d=\"M20 70H90M150 70H245\"/><rect x=\"90\" y=\"60\" width=\"60\" height=\"20\" fill=\"white\"/><path d=\"M120 108V132M135 113V127M135 120H145\"/><circle cx=\"245\" cy=\"95\" r=\"13\" fill=\"white\"/></g><g font-size=\"13\"><text x=\"99\" y=\"25\">6 Ом</text><text x=\"99\" y=\"75\">3 Ом</text><text x=\"240\" y=\"100\">А</text><text x=\"150\" y=\"137\">12 В</text></g></svg>", "tol": 1e-06}, {"n": 13, "topic": "Механика", "stem": "Брусок скользит по горизонтальной поверхности на 7 м. Сила трения скольжения равна 5 Н. Найдите работу силы трения (Дж), учитывая знак.", "ans": "-35", "hints": ["Сравни направления силы трения и перемещения.", "Вспомни косинус угла между противоположными векторами."], "kind": "число", "diagram": "", "tol": 1e-06}, {"n": 14, "topic": "Механика", "stem": "Установите соответствие: А) закон Гука; Б) второй закон Ньютона; В) закон сохранения импульса замкнутой системы.\n1) Σp⃗=const; 2) F⃗рез=ma⃗; 3) Fупр=k|x|; 4) A=Pt. Запишите цифры в порядке А, Б, В.", "ans": "321", "hints": ["Определи, какие величины связывает каждый закон.", "Отличай силу отдельного взаимодействия от равнодействующей."], "kind": "соответствие", "diagram": "", "tol": 1e-06}, {"n": 15, "topic": "Теплота", "stem": "Чистый лёд при 0 °C плавится при нормальном атмосферном давлении, получая теплоту.\nВыберите два верных утверждения. Запишите их номера.\n1) Температура смеси льда и воды растёт.\n2) Внутренняя энергия увеличивается.\n3) Масса воды уменьшается.\n4) Температура остаётся постоянной до завершения плавления.\n5) Подводимая теплота расходуется только на увеличение средней кинетической энергии молекул.", "ans": "24", "hints": ["Вспомни отличие нагревания от фазового перехода.", "На что расходуется теплота при постоянной температуре?"], "kind": "утверждения", "diagram": "", "tol": 1e-06}, {"n": 16, "topic": "Блоки и КПД", "stem": "На рисунке показаны две системы идеальных блоков. Грузы поднимают равномерно, свободные концы канатов С и D движутся с одинаковой по модулю скоростью. Какое утверждение верно?\n1) Груз А движется медленнее точки С.\n2) Скорости груза А и точки С равны по модулю.\n3) Груз В движется быстрее точки D.\n4) Скорости груза В и точки D равны по модулю.\nЗапишите номер утверждения.", "ans": "2", "hints": ["Посчитай участки нити, удерживающие каждый груз.", "Сравни перемещения груза и свободного конца за одно время."], "kind": "соответствие", "diagram": "<svg viewBox=\"0 0 350 230\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"#333\" stroke-width=\"2\" fill=\"none\"><path d=\"M30 20H145M85 20V55\"/><circle cx=\"85\" cy=\"80\" r=\"25\" fill=\"#eee\"/><path d=\"M60 165V80A25 25 0 0 1 110 80V170\"/><rect x=\"40\" y=\"165\" width=\"40\" height=\"30\" fill=\"#ddd\"/><path d=\"M205 20H320M230 20V140A25 25 0 0 0 280 140V45\"/><circle cx=\"255\" cy=\"140\" r=\"25\" fill=\"#eee\"/><path d=\"M255 140V185\"/><rect x=\"235\" y=\"185\" width=\"40\" height=\"30\" fill=\"#ddd\"/></g><g font-size=\"15\"><text x=\"53\" y=\"185\">А</text><text x=\"116\" y=\"170\">С</text><text x=\"248\" y=\"205\">В</text><text x=\"288\" y=\"50\">D</text></g></svg>", "tol": 1e-06}, {"n": 17, "topic": "Блоки и КПД", "stem": "Один и тот же груз равномерно поднимают на одинаковую высоту: сначала идеальным неподвижным блоком, затем идеальным подвижным. Как изменятся А) модуль приложенной силы; Б) перемещение свободного конца нити; В) затраченная работа?\n1) увеличится; 2) уменьшится; 3) не изменится. Запишите цифры в порядке А, Б, В.", "ans": "213", "hints": ["Вспомни золотое правило механики.", "Сравни число удерживающих ветвей нити."], "kind": "соответствие", "diagram": "", "tol": 1e-06}, {"n": 18, "topic": "Блоки и КПД", "stem": "Груз массой 16 кг равномерно поднимают идеальным подвижным блоком на 2 м. g=10 Н/кг.\nВыберите два верных утверждения. Запишите их номера.\n1) Приложенная сила равна 160 Н.\n2) Работа приложенной силы равна 320 Дж.\n3) Свободный конец нити перемещается на 1 м.\n4) Равнодействующая сил на груз отлична от нуля.\n5) Выигрыш в силе равен двум.", "ans": "25", "hints": ["Запиши второй закон Ньютона для равномерного подъёма.", "Сопоставь полезную и затраченную работу."], "kind": "утверждения", "diagram": "", "tol": 1e-06}, {"n": 19, "topic": "Блоки и КПД", "stem": "Груз массой 18 кг равномерно поднимают на 2 м с помощью подвижного блока. КПД 75 %. Нить нерастяжима. g=10 Н/кг. Найдите приложенную силу (Н).", "ans": "120", "hints": ["Начни с определения КПД.", "Учти, что свободный конец проходит двойную высоту."], "kind": "число", "diagram": "", "tol": 1e-06}, {"n": 20, "topic": "Электричество", "stem": "Резистор сопротивлением 8 Ом подключён к источнику 12 В. Какое количество теплоты выделится за 2 минуты? Ответ в джоулях.", "ans": "2160", "hints": ["Сначала найди ток или мощность.", "Переведи минуты в секунды и используй закон Джоуля — Ленца."], "kind": "число", "diagram": "", "tol": 1e-06}];

const $=id=>document.getElementById(id); let idx=0, started=Date.now(), last=started, ended=null;
const R=Q.map(()=>({seconds:0,inputs:[],hints:0,solved:false,entered:''}));
function clock(){if(!ended){R[idx].seconds+=(Date.now()-last)/1000;last=Date.now()}}
function valid(q,s){s=s.trim().replace(/−/g,'-'); if(q.kind==='число'){s=s.replace(/\s/g,'').replace(',','.'); if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return false;return Math.abs(Number(s)-Number(q.ans))<=Math.max(1e-6,Math.abs(Number(q.ans))*1e-8)} s=s.replace(/[\s,;]+/g,'');if(!/^\d+$/.test(s))return false;return q.kind==='утверждения'?[...s].sort().join('')===[...q.ans].sort().join(''):s===q.ans}
function show(){last=Date.now();let q=Q[idx],r=R[idx];$('meta').textContent=`Задание ${idx+1} из ${Q.length} · ${q.topic}`;$('stem').textContent=q.stem;$('figure').innerHTML=q.diagram;$('answer').value=r.entered;$('answer').disabled=r.solved||!!ended;$('feedback').textContent=r.solved?'Верно!':r.inputs.length?'Пока неверно. Попробуй ещё.':'';$('hints').innerHTML=q.hints.slice(0,r.hints).map((h,i)=>`<div class="hint">Подсказка ${i+1}. ${h}</div>`).join('');$('check').disabled=r.solved||!!ended;$('hint').disabled=r.solved||r.hints>=q.hints.length||!!ended;$('prev').disabled=idx===0;$('next').textContent=idx===Q.length-1?'Завершить':'Дальше';$('bar').style.width=100*R.filter(x=>x.solved).length/Q.length+'%'}
$('answer').oninput=e=>R[idx].entered=e.target.value;$('answer').onkeydown=e=>{if(e.key==='Enter')$('check').click()};$('check').onclick=()=>{let r=R[idx],q=Q[idx],s=$('answer').value;if(!s.trim()||r.solved||ended)return;let ok=valid(q,s);r.inputs.push({answer:s,correct:ok,hints:r.hints});r.solved=ok;clock();show()};$('hint').onclick=()=>{clock();R[idx].hints++;show()};function move(n){clock();idx=n;show()};$('prev').onclick=()=>{if(idx>0)move(idx-1)};$('next').onclick=()=>{if(idx<Q.length-1)move(idx+1);else finish()};
function first(r){return !!r.inputs[0]?.correct && r.inputs[0].hints===0}function time(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function finish(){if(!ended){if(R.some(r=>!r.solved)&&!confirm('Есть нерешённые задания. Завершить тест?'))return;clock();ended=Date.now()}show();$('finish').hidden=false;$('summary').textContent=`С первой попытки без подсказок: ${R.filter(first).length}/20. Всего решено: ${R.filter(r=>r.solved).length}/20. Время: ${time((ended-started)/1000)}.`;$('finish').scrollIntoView()}
$('download').onclick=()=>{let c=document.createElement('canvas'),x=c.getContext('2d');let rows=R.map(r=>{let s=r.inputs.map(a=>a.answer+(a.correct?' ✓':' ×')).join(' → ')||'—';let lines=[];while(s.length>55){lines.push(s.slice(0,55));s=s.slice(55)}lines.push(s);return lines});c.width=1200;c.height=310+rows.reduce((a,l)=>a+Math.max(64,l.length*27+36),0);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#142c46';x.font='bold 36px Arial';x.fillText('Физика · результаты теста к 29.11.26',40,60);x.font='24px Arial';x.fillText(new Date(ended).toLocaleString('ru-RU'),40,100);x.fillText(`С первой попытки без подсказок: ${R.filter(first).length}/20   Решено: ${R.filter(r=>r.solved).length}/20`,40,145);x.fillText(`Время: ${time((ended-started)/1000)}   Заданий с подсказками: ${R.filter(r=>r.hints).length}`,40,185);x.font='20px Arial';x.fillText('№ / тема / ключ             Попытки · подсказки · время         Все ответы по порядку',40,255);let y=280;R.forEach((r,i)=>{let h=Math.max(64,rows[i].length*27+36);x.fillStyle=first(r)?'#e1f3e8':r.solved?'#fff1d1':'#fce0e0';x.fillRect(30,y,1140,h-3);x.fillStyle='#142c46';x.font='bold 20px Arial';x.fillText(`${i+1}. ${Q[i].topic} · ${Q[i].ans}`,43,y+25);x.font='20px Arial';x.fillText(`${r.inputs.length} попыт. · ${r.hints} подс. · ${time(r.seconds)}`,43,y+49);rows[i].forEach((l,j)=>x.fillText(l,530,y+28+j*27));y+=h});let a=document.createElement('a');a.download='results_29-11-26.png';a.href=c.toDataURL('image/png');a.click()};show();
</script></body></html>
