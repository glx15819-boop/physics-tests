<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сборный тест по физике · ОГЭ</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2937;background:#f3f6fa}*{box-sizing:border-box}main{max-width:840px;margin:30px auto;padding:0 18px}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 7px 30px #1d304312}h1{margin:0 0 8px}h2{font-size:21px;line-height:1.4}p{line-height:1.65}.muted{color:#64748b}.pill{display:inline-block;background:#eaf2ff;color:#245f9a;border-radius:20px;padding:5px 12px;font-size:13px}.bar{height:8px;background:#e8eef6;border-radius:8px;overflow:hidden;margin:20px 0}.bar>div{height:100%;background:#2477c5;transition:width .2s}input{font:inherit;width:100%;padding:14px;border:1px solid #bac9d9;border-radius:12px;margin:10px 0}button{font:inherit;border:0;border-radius:11px;padding:11px 16px;background:#246fba;color:white;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:#e8eff8;color:#254765}button:disabled{opacity:.45;cursor:default}.feedback{min-height:25px;font-weight:600}.hint{background:#fff7df;border-left:4px solid #dda431;padding:10px 14px;border-radius:7px;margin:8px 0}.chart{width:100%;max-width:500px;height:auto}footer{margin-top:22px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}@media(max-width:550px){main{margin:10px auto}.card{padding:19px}}
</style></head><body><main><div class="card"><h1>Физика · подготовка к ОГЭ</h1><p class="muted">20 заданий. Ответ вводи самостоятельно, без выбора вариантов. Можно использовать подсказки. В конце скачай отчёт и отправь преподавателю.</p><div class="bar"><div id="bar"></div></div><div id="meta"></div><h2 id="stem"></h2><div id="figure"></div><label for="answer">Твой ответ</label><input id="answer" autocomplete="off" placeholder="Число или последовательность цифр"><div id="feedback" class="feedback" aria-live="polite"></div><div id="hints"></div><button id="check">Проверить</button><button id="hint" class="secondary">Подсказка</button><footer><button id="prev" class="secondary">Назад</button><button id="next">Дальше</button></footer><div id="finish" hidden><h2>Работа завершена</h2><p id="summary"></p><button id="download">Скачать отчёт</button></div></div></main><script>
const Q=[{"n": 1, "topic": "Работа и мощность", "kind": "число", "stem": "Двигатель совершил работу 3600 Дж за 30 с. Найдите мощность в ваттах.", "ans": "120", "hints": ["Вспомни, какая величина показывает работу за единицу времени.", "Раздели работу на время."], "idea": "Мощность равна работе, делённой на время.", "math": "Дано: A = 3600 Дж; t = 30 с. СИ: не требуется. Найти: P. P = A/t = 3600 Дж / 30 с = 120 Вт.", "diag": "Вспоминает ли формулу мощности без подсказки?", "unit": "Вт", "tol": 0.01, "diagram": ""}, {"n": 2, "topic": "Работа и мощность", "kind": "число", "stem": "Мотор мощностью 250 Вт работал 12 с. Какую работу он совершил? Ответ в джоулях.", "ans": "3000", "hints": ["Запиши связь мощности, работы и времени.", "Вырази из формулы работу, а не мощность."], "idea": "Ключевое действие — самостоятельно выразить работу.", "math": "Дано: P = 250 Вт; t = 12 с. Найти: A. P = A/t; A = Pt = 250 Вт · 12 с = 3000 Дж.", "diag": "Может ли выразить A из P = A/t?", "unit": "Дж", "tol": 0.01, "diagram": ""}, {"n": 3, "topic": "Работа и мощность", "kind": "число", "stem": "Подъёмник совершил работу 9000 Дж при мощности 300 Вт. Сколько секунд он работал?", "ans": "30", "hints": ["Какие три величины связывает формула мощности?", "Вырази время через работу и мощность."], "idea": "Из основной формулы мощности выражаем время.", "math": "Дано: A = 9000 Дж; P = 300 Вт. Найти: t. P = A/t; t = A/P = 9000 Дж / 300 Вт = 30 с.", "diag": "Проверка алгебраического преобразования.", "unit": "с", "tol": 0.01, "diagram": ""}, {"n": 4, "topic": "Работа и мощность", "kind": "соответствие", "stem": "Установите соответствие между величиной и единицей СИ. А) работа; Б) мощность; В) сила. 1) ньютон; 2) ватт; 3) джоуль; 4) ампер. Запишите три цифры в порядке АБВ.", "ans": "321", "hints": ["Сначала вспомни единицу измерения силы.", "Мощность измеряется не в джоулях."], "idea": "Соотносим физическую величину и её единицу.", "math": "Работа — джоуль (3); мощность — ватт (2); сила — ньютон (1). Ответ: 321.", "diag": "Путает ли величины и единицы?", "unit": "", "tol": 0.01, "diagram": ""}, {"n": 5, "topic": "КПД", "kind": "число", "stem": "Механизм получил 800 Дж энергии, из которых 600 Дж пошло на полезную работу. Определите КПД в процентах.", "ans": "75", "hints": ["КПД сравнивает полезную и затраченную энергию.", "Не забудь перевести долю в проценты."], "idea": "Отношение полезной работы к затраченной энергии.", "math": "Дано: Aпол = 600 Дж; Eзатр = 800 Дж. Найти: η. η = Aпол/Eзатр · 100% = 600/800 · 100% = 75%.", "diag": "Не переворачивает ли дробь?", "unit": "%", "tol": 0.01, "diagram": ""}, {"n": 6, "topic": "КПД", "kind": "число", "stem": "Насос мощностью 400 Вт работал 50 с. КПД насоса 60%. Какова полезная работа в джоулях?", "ans": "12000", "hints": ["Сначала найди всю затраченную энергию за время работы.", "Используй КПД как долю полезной работы."], "idea": "Два шага: затраченная энергия и полезная работа.", "math": "Дано: P = 400 Вт; t = 50 с; η = 60%. Найти: Aпол. Eзатр = Pt = 400 · 50 = 20000 Дж; Aпол = 0,60 · 20000 = 12000 Дж.", "diag": "Может ли объединить P = A/t и КПД?", "unit": "Дж", "tol": 0.01, "diagram": ""}, {"n": 7, "topic": "КПД", "kind": "число", "stem": "Электродвигатель с КПД 80% поднимает груз массой 40 кг на высоту 6 м. Сколько энергии в джоулях он потребил? g = 10 Н/кг.", "ans": "3000", "hints": ["Найди полезную работу при подъёме груза.", "КПД — отношение полезной работы к затраченной энергии."], "idea": "Находим mgh и делим на КПД, записанный долей.", "math": "Дано: m = 40 кг; h = 6 м; η = 80%; g = 10 Н/кг. Найти: Eзатр. Aпол = mgh = 40 · 10 · 6 = 2400 Дж; Eзатр = Aпол/0,8 = 3000 Дж.", "diag": "Не умножает ли на КПД вместо деления?", "unit": "Дж", "tol": 0.01, "diagram": ""}, {"n": 8, "topic": "Колебания", "kind": "число", "stem": "Маятник совершил 18 полных колебаний за 36 с. Найдите период в секундах.", "ans": "2", "hints": ["Период — время одного колебания.", "Раздели всё время на число колебаний."], "idea": "Находим время одного колебания.", "math": "Дано: N = 18; t = 36 с. Найти: T. T = t/N = 36/18 = 2 с.", "diag": "Путает период с частотой?", "unit": "с", "tol": 0.01, "diagram": ""}, {"n": 9, "topic": "Колебания", "kind": "число", "stem": "Частота колебаний равна 4 Гц. Сколько полных колебаний произойдёт за 15 с?", "ans": "60", "hints": ["Частота показывает число колебаний за секунду.", "Вырази N из ν = N/t."], "idea": "Восстанавливаем число колебаний из частоты.", "math": "Дано: ν = 4 Гц; t = 15 с. Найти: N. ν = N/t; N = νt = 4 · 15 = 60.", "diag": "Выражение неизвестной из формулы.", "unit": "колебаний", "tol": 0.01, "diagram": ""}, {"n": 10, "topic": "Колебания", "kind": "утверждения", "stem": "Выберите ВСЕ верные утверждения об идеальном математическом маятнике при малых колебаниях. 1) При увеличении длины период растёт. 2) Период зависит от массы груза. 3) При увеличении g период уменьшается. 4) Частота равна периоду. Запишите номера по возрастанию.", "ans": "13", "hints": ["Вспомни, от каких величин зависит период математического маятника.", "Сравни влияние длины и ускорения свободного падения."], "idea": "Используем T = 2π√(l/g).", "math": "Период увеличивается с l и уменьшается с g. Масса не входит в формулу; ν = 1/T. Верны 1 и 3.", "diag": "Понимает ли качественную зависимость, не подставляя числа?", "unit": "", "tol": 0.01, "diagram": ""}, {"n": 11, "topic": "Колебания", "kind": "число", "stem": "Период пружинного маятника равен 0,5 с. Какой станет период, если массу груза увеличить в 9 раз? Ответ в секундах.", "ans": "1.5", "hints": ["Период пружинного маятника зависит от квадратного корня из массы.", "Если масса выросла в 9 раз, во сколько раз вырос корень?"], "idea": "Сравниваем периоды через отношение масс.", "math": "T = 2π√(m/k); T₂/T₁ = √(m₂/m₁) = √9 = 3; T₂ = 0,5 · 3 = 1,5 с.", "diag": "Понимает ли пропорциональность квадратному корню?", "unit": "с", "tol": 0.01, "diagram": ""}, {"n": 12, "topic": "Колебания", "kind": "соответствие", "stem": "Пружинный маятник без трения движется из положения равновесия к крайнему положению. Как изменятся величины? А) кинетическая энергия; Б) потенциальная энергия пружины; В) полная механическая энергия. 1) увеличится; 2) уменьшится; 3) не изменится. Запишите цифры в порядке АБВ.", "ans": "213", "hints": ["В крайнем положении скорость становится нулевой.", "Полная энергия сохраняется при отсутствии потерь."], "idea": "Кинетическая переходит в потенциальную, полная сохраняется.", "math": "Кинетическая энергия уменьшается (2), потенциальная увеличивается (1), полная не изменяется (3). Ответ 213.", "diag": "Различает виды энергии и полную энергию?", "unit": "", "tol": 0.01, "diagram": ""}, {"n": 13, "topic": "Электричество", "kind": "число", "stem": "Через проводник за 20 с прошёл заряд 100 Кл. Найдите силу тока в амперах.", "ans": "5", "hints": ["Сила тока связана с зарядом и временем.", "Раздели заряд на время."], "idea": "Применяем определение силы тока.", "math": "Дано: q = 100 Кл; t = 20 с. Найти: I. I = q/t = 100/20 = 5 А.", "diag": "Не путает ли I = q/t с P = UI?", "unit": "А", "tol": 0.01, "diagram": ""}, {"n": 14, "topic": "Электричество", "kind": "число", "stem": "К резистору сопротивлением 12 Ом приложено напряжение 36 В. Найдите силу тока в амперах.", "ans": "3", "hints": ["Используй закон Ома для участка цепи.", "Сила тока равна отношению напряжения к сопротивлению."], "idea": "Применяем закон Ома.", "math": "Дано: U = 36 В; R = 12 Ом. Найти: I. I = U/R = 36/12 = 3 А.", "diag": "Отличает закон Ома от определения силы тока?", "unit": "А", "tol": 0.01, "diagram": ""}, {"n": 15, "topic": "Электричество", "kind": "число", "stem": "Провод длиной 4 м и площадью поперечного сечения 2 мм² сделан из материала с удельным сопротивлением 0,5 Ом·мм²/м. Найдите сопротивление в омах.", "ans": "1", "hints": ["Вспомни, как сопротивление зависит от длины и площади сечения.", "Используй R = ρl/S; единицы уже согласованы."], "idea": "Подставляем в формулу сопротивления провода.", "math": "Дано: ρ = 0,5 Ом·мм²/м; l = 4 м; S = 2 мм². Найти: R. R = ρl/S = 0,5 · 4/2 = 1 Ом.", "diag": "Не забывает ли обозначение площади S?", "unit": "Ом", "tol": 0.01, "diagram": ""}, {"n": 16, "topic": "Динамика", "kind": "число", "stem": "На тележку массой 3 кг горизонтально вправо действует сила 18 Н, а сила трения 6 Н направлена влево. Найдите ускорение вправо в м/с².", "ans": "4", "hints": ["Выбери ось Ox вправо и запиши второй закон Ньютона в проекции.", "Равнодействующая — разность противоположных сил."], "idea": "Находим равнодействующую и ускорение.", "math": "Дано: m = 3 кг; F = 18 Н; Fтр = 6 Н. Найти: ax. Векторно: F⃗ + F⃗тр + N⃗ + mg⃗ = ma⃗. Ox вправо: Fx + Fтр,x = max; 18 − 6 = 3ax; ax = 4 м/с². Oy вверх: Ny + (mg⃗)y = 0; N − mg = 0.", "diag": "Соблюдает ли знаки в проекции?", "unit": "м/с²", "tol": 0.01, "diagram": ""}, {"n": 17, "topic": "Динамика", "kind": "число", "stem": "Автомобиль движется по окружности радиусом 20 м со скоростью 10 м/с. Найдите центростремительное ускорение в м/с².", "ans": "5", "hints": ["Вспомни зависимость центростремительного ускорения от скорости и радиуса.", "Скорость нужно возвести в квадрат."], "idea": "Применяем aц = v²/r.", "math": "Дано: v = 10 м/с; r = 20 м. Найти: aц. aц = v²/r = 100/20 = 5 м/с².", "diag": "Не забывает ли квадрат скорости?", "unit": "м/с²", "tol": 0.01, "diagram": ""}, {"n": 18, "topic": "Динамика", "kind": "утверждения", "stem": "Тело движется равномерно по окружности. Выберите ВСЕ верные утверждения. 1) Модуль скорости постоянен. 2) Вектор скорости постоянен. 3) Ускорение направлено к центру. 4) Ускорение равно нулю. Запишите номера по возрастанию.", "ans": "13", "hints": ["Различай модуль вектора и его направление.", "При движении по окружности направление скорости меняется."], "idea": "Равномерность означает постоянство модуля скорости, но не вектора.", "math": "Верны 1 и 3. Вектор скорости меняет направление, ускорение ненулевое и направлено к центру.", "diag": "Путает равномерное движение с отсутствием ускорения?", "unit": "", "tol": 0.01, "diagram": ""}, {"n": 19, "topic": "Графики", "kind": "число", "stem": "На графике зависимости скорости от времени скорость линейно возрастает от 2 м/с при t = 0 до 10 м/с при t = 4 с. Найдите ускорение в м/с².", "ans": "2", "hints": ["Ускорение — наклон графика скорости.", "Найди изменение скорости и раздели на промежуток времени."], "idea": "Вычисляем наклон графика v(t).", "math": "Дано: v₀ = 2 м/с; v = 10 м/с; t = 4 с. Найти: a. a = (v − v₀)/t = (10 − 2)/4 = 2 м/с².", "diag": "Читает ли график как изменение, а не значение скорости?", "unit": "м/с²", "tol": "velocity", "diagram": ""}, {"n": 20, "topic": "Теплота", "kind": "утверждения", "stem": "Выберите ВСЕ верные утверждения о нагревании и плавлении чистого кристаллического вещества при постоянном давлении. 1) При нагревании твёрдого тела его температура может повышаться. 2) Во время плавления при температуре плавления температура вещества растёт. 3) Во время плавления подводимая энергия идёт на изменение внутренней структуры вещества. 4) Удельная теплота плавления измеряется в джоулях на килограмм. Запишите номера по возрастанию.", "ans": "134", "hints": ["Раздели процесс нагревания и процесс фазового перехода.", "При плавлении чистого вещества температура остаётся постоянной."], "idea": "Различаем нагревание и плавление.", "math": "Верны 1, 3, 4. При плавлении температура чистого кристаллического вещества постоянна до завершения перехода.", "diag": "Путает изменение температуры и изменение структуры?", "unit": "", "tol": 0.01, "diagram": ""}];const started=Date.now();let idx=0;const R=Q.map(q=>({attempts:0,first:null,hints:0,seconds:0,solved:false,inputs:[],entered:'',last:Date.now()}));const $=id=>document.getElementById(id);
function clock(){const r=R[idx];r.seconds+=(Date.now()-r.last)/1000;r.last=Date.now()}
function norm(x){return String(x).trim().replace(/\s/g,'').replace(',','.').replace(/[;]+/g,'').replace(/[^\d.\-]/g,'')}
function valid(q,s){let a=norm(s),b=norm(q.ans);if(q.kind==='число'){let n=Number(a),v=Number(b);return a!==''&&Number.isFinite(n)&&Math.abs(n-v)<=Math.max(q.tol,Math.abs(v)*0.001)}if(q.kind==='утверждения'){return a.split('').sort().join('')===b.split('').sort().join('')}return a===b}
function chart(){return `<svg class="chart" viewBox="0 0 480 240" role="img" aria-label="График скорости: от 2 м/с в нулевой момент до 10 м/с в 4 секунды"><path d="M60 20V205H455" stroke="#34465b" stroke-width="2" fill="none"/><path d="M60 173L395 45" stroke="#217ac0" stroke-width="4" fill="none"/><circle cx="60" cy="173" r="5" fill="#217ac0"/><circle cx="395" cy="45" r="5" fill="#217ac0"/><path d="M395 45V205" stroke="#aab7c6" stroke-dasharray="5 5"/><text x="14" y="25">v, м/с</text><text x="430" y="228">t, с</text><text x="30" y="178">2</text><text x="24" y="50">10</text><text x="390" y="225">4</text><text x="45" y="224">0</text></svg>`}
function show(){let q=Q[idx],r=R[idx];r.last=Date.now();$('meta').innerHTML=`<span class="pill">Задание ${idx+1} из ${Q.length}</span> <span class="pill">${q.topic}</span>`;$('stem').textContent=q.stem;$('figure').innerHTML=q.diagram==='velocity'?chart():'';$('answer').value=r.entered;$('answer').disabled=r.solved;$('feedback').textContent=r.solved?'Верно!':r.attempts?'Пока неверно. Попробуй ещё.':'';$('hints').innerHTML=q.hints.slice(0,r.hints).map((x,i)=>`<div class="hint"><b>Подсказка ${i+1}.</b> ${x}</div>`).join('');$('bar').style.width=100*R.filter(x=>x.solved).length/Q.length+'%';$('prev').disabled=idx===0;$('next').textContent=idx===Q.length-1?'Завершить':'Дальше';$('check').disabled=r.solved;$('hint').disabled=r.hints>=q.hints.length||r.solved;$('finish').hidden=true}
$('answer').oninput=e=>R[idx].entered=e.target.value;
$('check').onclick=()=>{let q=Q[idx],r=R[idx];if(r.solved)return;let s=$('answer').value;if(!s.trim()){$('feedback').textContent='Сначала введи ответ.';return}r.attempts++;let ok=valid(q,s);if(r.first===null)r.first=ok;r.inputs.push({answer:s,correct:ok});if(ok){r.solved=true;$('feedback').textContent='Верно!';$('answer').disabled=true;$('check').disabled=true;$('hint').disabled=true;$('bar').style.width=100*R.filter(x=>x.solved).length/Q.length+'%'}else $('feedback').textContent='Пока неверно. Проверь физическую идею и вычисления.'};
$('hint').onclick=()=>{let r=R[idx];if(r.hints<Q[idx].hints.length){r.hints++;$('hints').innerHTML+=`<div class="hint"><b>Подсказка ${r.hints}.</b> ${Q[idx].hints[r.hints-1]}</div>`;if(r.hints===Q[idx].hints.length)$('hint').disabled=true}};
function move(n){clock();idx=n;show()};$('prev').onclick=()=>{if(idx>0)move(idx-1)};$('next').onclick=()=>{clock();if(idx<Q.length-1){idx++;show()}else finish()};
function report(){return {title:'Сборный тест по физике · ОГЭ',date:new Date().toLocaleString('ru-RU'),totalSeconds:Math.round((Date.now()-started)/1000),firstCorrect:R.filter(r=>r.first===true).length,solved:R.filter(r=>r.solved).length,items:Q.map((q,i)=>({number:q.n,topic:q.topic,kind:q.kind,condition:q.stem,attempts:R[i].attempts,firstCorrect:R[i].first,hintsUsed:R[i].hints,seconds:Math.round(R[i].seconds+(idx===i?(Date.now()-R[i].last)/1000:0)),solved:R[i].solved,answers:R[i].inputs}))}}
function finish(){$('finish').hidden=false;let r=report();$('summary').textContent=`Верно с первой попытки: ${r.firstCorrect}/${Q.length}. Решено всего: ${r.solved}/${Q.length}. Скачай отчёт для преподавателя.`;$('finish').scrollIntoView({behavior:'smooth'})}
$('download').onclick=()=>{let blob=new Blob([JSON.stringify(report(),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Отчёт_ОГЭ.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};show();
</script></body></html>
